name: zfome

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zfome}
      POSTGRES_USER: ${POSTGRES_USER:-zfome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zfome_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - zfome-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [zfome]

  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks: [zfome]

  migrations:
    build:
      context: .
      dockerfile: src/ZFome.Infrastructure.Migrations/Dockerfile
    environment:
      Database__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-zfome};Username=${POSTGRES_USER:-zfome};Password=${POSTGRES_PASSWORD:-zfome_dev}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [zfome]

  api:
    build:
      context: .
      dockerfile: src/ZFome.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-zfome};Username=${POSTGRES_USER:-zfome};Password=${POSTGRES_PASSWORD:-zfome_dev}
      Authentication__PlatformCode: ${AUTHENTICATION_PLATFORM_CODE:-PLATFORM}
      PlatformBootstrap__Enabled: ${PLATFORM_BOOTSTRAP_ENABLED:-false}
      PlatformBootstrap__Email: ${PLATFORM_BOOTSTRAP_EMAIL:-}
      PlatformBootstrap__TemporaryPassword: ${PLATFORM_BOOTSTRAP_TEMPORARY_PASSWORD:-}
      AuthenticationEmail__Host: ${AUTHENTICATION_EMAIL_HOST:-}
      AuthenticationEmail__Port: ${AUTHENTICATION_EMAIL_PORT:-587}
      AuthenticationEmail__Username: ${AUTHENTICATION_EMAIL_USERNAME:-}
      AuthenticationEmail__Password: ${AUTHENTICATION_EMAIL_PASSWORD:-}
      AuthenticationEmail__FromAddress: ${AUTHENTICATION_EMAIL_FROM_ADDRESS:-}
      AuthenticationEmail__EnableSsl: ${AUTHENTICATION_EMAIL_ENABLE_SSL:-true}
      NotificationSmtp__Host: ${NOTIFICATION_SMTP_HOST:-mailpit}
      NotificationSmtp__Port: ${NOTIFICATION_SMTP_PORT:-1025}
      NotificationSmtp__Username: ${NOTIFICATION_SMTP_USERNAME:-}
      NotificationSmtp__Password: ${NOTIFICATION_SMTP_PASSWORD:-}
      NotificationSmtp__FromAddress: ${NOTIFICATION_SMTP_FROM_ADDRESS:-no-reply@zfome.test}
      NotificationSmtp__EnableSsl: ${NOTIFICATION_SMTP_ENABLE_SSL:-false}
      NotificationSmtp__TimeoutSeconds: ${NOTIFICATION_SMTP_TIMEOUT_SECONDS:-15}
      MetaWhatsApp__GraphApiVersion: ${META_WHATSAPP_GRAPH_API_VERSION:-}
      MetaWhatsApp__PhoneNumberId: ${META_WHATSAPP_PHONE_NUMBER_ID:-}
      MetaWhatsApp__AccessToken: ${META_WHATSAPP_ACCESS_TOKEN:-}
      MetaWhatsApp__TimeoutSeconds: ${META_WHATSAPP_TIMEOUT_SECONDS:-20}
      NotificationDelivery__MaximumAttempts: ${NOTIFICATION_MAXIMUM_ATTEMPTS:-5}
      NotificationDelivery__InitialRetryDelaySeconds: ${NOTIFICATION_INITIAL_RETRY_DELAY_SECONDS:-30}
      NotificationDelivery__MaximumRetryDelaySeconds: ${NOTIFICATION_MAXIMUM_RETRY_DELAY_SECONDS:-1800}
      Cors__AllowedOrigins__0: ${WEB_ORIGIN:-http://localhost:9000}
      CustomerOrderNotifications__PublicBaseUrl: ${WEB_ORIGIN:-http://localhost:9000}
      RealtimeOrders__ClientTimeoutSeconds: ${REALTIME_CLIENT_TIMEOUT_SECONDS:-30}
      RealtimeOrders__KeepAliveSeconds: ${REALTIME_KEEP_ALIVE_SECONDS:-15}
      RealtimeOrders__MaximumReceiveMessageBytes: ${REALTIME_MAX_MESSAGE_BYTES:-32768}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [zfome]

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${API_PORT:-8080}
        VITE_REALTIME_BASE_URL: ${REALTIME_BASE_URL:-http://localhost:8080}
    ports:
      - "${WEB_PORT:-9000}:80"
    depends_on:
      api:
        # No Fast Mode, o Visual Studio inicia a aplicação somente após criar a
        # composição. Aguardar o health check aqui impediria o debugger de
        # iniciar o próprio processo da API.
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [zfome]

volumes:
  zfome-postgres:

networks:
  zfome:
    driver: bridge
